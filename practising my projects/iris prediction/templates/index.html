<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <title>Iris Prediction</title>
</head>
<body>
    <div class="container">
        <h1>Iris Predictions</h1>
        <form action="/predict" method="post">
            <label for="sepal_length">Sepal Length:</label>
            <input type="number" id="sepal_length" name="sepal_length" required><br><br>
            
            <label for="sepal_width">Sepal Width:</label>
            <input type="number" id="sepal_width" name="sepal_width" required><br><br>
            
            <label for="petal_length">Petal Length:</label>
            <input type="number" id="petal_length" name="petal_length" required><br><br>
            
            <label for="petal_width">Petal Width:</label>
            <input type="number" id="petal_width" name="petal_width" required><br><br>
            
            <input type="submit" value="Predict">
        </form>
            <h2>{{ prediction_text }}</h2>
    </div> 
    
</body>
</html>
