<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="\static\style.css">
    <title> Basic Flask Calculator</title>
</head>

<body>
    <form method="post">
         <h1>Basic Calculator</h2>
            <input type="number" name="num1 " placeholder="Enter first number:" step = "any" required><br>
            <input type="number" name="num2" placeholder="Enter second number:" step = "any" required><br><br>
        <select name="operation">
            <option value="+">+(add)</option>
            <option value="-">-(subtract)</option>
            <option value="*">*(multiply)</option>
            <option value="/">/(divide)</option>
        </select><br><br>
        <input type="submit" value="Calculate">
         <h3>The result of : {{result}}</h3>
    </form>
</body>

</html>
